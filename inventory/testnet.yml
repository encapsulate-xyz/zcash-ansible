---
# maintains testnet inventory grouped by project names
all:
  vars:
    env: testnet
  children:
    zcash:
      hosts:
        ts.i1.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          fetch_vault_secrets: true
          # The finalizer: Holdfast reads its BFT view over Tailscale, so its RPC binds every interface
          rpc_tailnet: true
          # Converts its finalizer commission into bonds, 1 cTAZ at a time (setup_autoconvert.yml)
          autoconvert: true
          autoconvert_finalizer: 24e66dea5c0c964aba73d267a91fa21261885653d68377d5351198f29ec1a11c
          cpu_quota: "800%"
          internal_miner: false
          internal_miner_threads: 6
          parallel_cpu_threads: 6
        ts.i2.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          fetch_vault_secrets: false
          cpu_quota: "3400%"
          internal_miner: true
          internal_miner_threads: 32
          parallel_cpu_threads: 32
        ts.i3.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          fetch_vault_secrets: false
          cpu_quota: "800%"
          internal_miner: true
          internal_miner_threads: 6
          parallel_cpu_threads: 6
        ts.i4.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          fetch_vault_secrets: false
          cpu_quota: "1000%"
          internal_miner: true
          internal_miner_threads: 8
          parallel_cpu_threads: 8
        ts.i5.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          fetch_vault_secrets: false
          cpu_quota: "600%"
          internal_miner: true
          internal_miner_threads: 4
          parallel_cpu_threads: 4
        ts.i6.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          fetch_vault_secrets: false
          cpu_quota: "600%"
          internal_miner: false
          internal_miner_threads: 4
          parallel_cpu_threads: 4
