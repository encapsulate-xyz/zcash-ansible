all:
  vars:
    env: testnet
  children:
    zcash:
      hosts:
        ts.i1.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          cpu_quota: "800%"
          internal_miner_threads: 6
          parallel_cpu_threads: 6
        ts.i2.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          cpu_quota: "3400%"
          internal_miner_threads: 32
          parallel_cpu_threads: 32
        ts.i3.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          cpu_quota: "800%"
          internal_miner_threads: 6
          parallel_cpu_threads: 6
        ts.i4.validator.zcash.testnet.encapsulate.xyz:
          type: validator
          cpu_quota: "1000%"
          internal_miner_threads: 8
          parallel_cpu_threads: 8
