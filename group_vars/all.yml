---
# maintains ports, bianry or repo urls

org: encapsulate
domain_regex: ^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$
monitor_server_dns: monitor.encapsulate.xyz
ansible_port: 8192

architecture_map:
  x86_64: amd64
  aarch64: arm64

default_node_types:
  - validator
  - default

tmp_dir: /tmp

zcash:
  validator:
    source_url: https://github.com/ShieldedLabs/crosslink_monolith/releases/download
    glibc:
      # fast mirror, but it deletes superseded builds (404 once Ubuntu ships a newer one)
      source_url: https://archive.ubuntu.com/ubuntu/pool/main/g/glibc
      # keeps every published build, but is slow (5-60s before the download starts): only used when the mirror fails
      fallback_source_url: https://launchpad.net/ubuntu/+archive/primary/+files
    # snapshot_sync.yml: daily chain state snapshots, made with the latest release
    snapshot:
      repo: 0xking-sol/crosslink-snapshots
    ports:
      p2p_port: 8788
      metrics_port: 8789
      rpc_port: 8790
      network_local_port: 12002
