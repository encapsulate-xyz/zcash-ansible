---
# maintains ports, bianry or repo urls

org: encapsulate
domain_regex: ^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$
monitor_server_dns: monitor.encapsulate.xyz
ansible_port: 8192

architecture_map:
  x86_64: amd64
  aarch64: arm64

default_node_types:
  - validator
  - default

tmp_dir: /tmp

zcash:
  validator:
    source_url: https://github.com/ShieldedLabs/crosslink_monolith/releases/download
    ports:
      p2p_port: 8788
      metrics_port: 8789
      rpc_port: 8790
      network_local_port: 12002
