---
# maintains versions and can overwrite all.yml
zcash:
  validator:
    version: v16
    # sha256 of the release's crosslink_<version>_ubuntu asset
    checksum: sha256:3c68c0c3801e2be3a1bdf7def1461ed856034c064d5b4558d3b37b0f0b557723
    # cache directory names for current and previous builds, so the chain state and wallet carry over
    cache_dir_name: crosslink_featurenet_20260929_staking3d
    previous_cache_dir_name: crosslink_featurenet_20260929
    # minimum glibc the release binary needs, hosts with an older one run it on Ubuntu's libc6 package
    glibc:
      version: "2.43"
      package_version: 2.43-2ubuntu2.4
      checksum: sha256:a613b457f3ff9c84ebd28af8a05afdec22605ad9aed87c71e3a6ae5170aeb9ca
    # setup_autoconvert.yml: converts the finalizer's commission into bonds
    autoconvert:
      amount_zats: 100000000          # 1 cTAZ per conversion
      fee_margin_zats: 100000         # 0.001 cTAZ the wallet needs for the fee
      check_every_seconds: 60
      confirm_timeout_seconds: 1800   # stop waiting for a conversion to be mined after 30 min
