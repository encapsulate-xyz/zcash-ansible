---
- name: Include user creation task
  ansible.builtin.include_tasks: tasks/create_user_and_directories.yml
  vars:
    home: "{{ autostake_home_dir }}"
    directories: "{{ autostake_directories }}"
    log_file_path: "{{ autostake_log_file_path }}"

- name: Copy auto-stake script
  ansible.builtin.template:
    src: autostake.sh.j2
    dest: "{{ autostake_script_file_path }}"
    owner: "{{ service_identifier }}"
    group: "{{ service_identifier }}"
    mode: "0755"
  notify:
    - Restart service

- name: Copy auto-stake systemd service file
  ansible.builtin.template:
    src: systemd.service.j2
    dest: /etc/systemd/system/{{ service_identifier }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload service
    - Restart service

- name: Start the auto-stake service and enable it at boot
  ansible.builtin.systemd:
    name: "{{ service_identifier }}"
    state: started
    enabled: true
    daemon_reload: true
