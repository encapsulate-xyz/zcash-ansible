---
# maintains directories and paths
node_home_dir: /opt/{{ service_identifier }}

node_bin_dir: "{{ node_home_dir }}/bin"
node_config_dir: "{{ node_home_dir }}/config"
node_data_dir: "{{ node_home_dir }}/data"
node_lib_dir: "{{ node_home_dir }}/lib"
node_log_dir: "{{ node_home_dir }}/log"
# zebrad only creates this on first start, but secret.seed is restored into it before that
node_network_data_dir: "{{ node_data_dir }}/{{ zcash.validator.network }}"

node_directories:
  - "{{ node_home_dir }}"
  - "{{ node_bin_dir }}"
  - "{{ node_config_dir }}"
  - "{{ node_data_dir }}"
  - "{{ node_lib_dir }}"
  - "{{ node_log_dir }}"
  - "{{ node_network_data_dir }}"

node_config_file_path: "{{ node_config_dir }}/{{ node_config_file_name }}"
node_log_file_path: "{{ node_log_dir }}/{{ service_identifier }}.log"

node_secret_seed_file_path: "{{ node_network_data_dir }}/{{ node_secret_seed_file_name }}"

# resource limits and thread counts
cpu_quota: 1000%
internal_miner_threads: 8
parallel_cpu_threads: 8
