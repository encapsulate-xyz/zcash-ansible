---
# maintains file name, binary names, and anything which is not a directory or path

# config file names
node_config_file_name: config.toml
node_secret_seed_file_name: secret.seed

# binary names
# the asset name has no release-candidate suffix: tag v17_rc1 ships crosslink_v17_ubuntu
node_service_default_binary_name: "crosslink_{{ zcash.validator.version | regex_replace('_rc[0-9]+$', '') }}_ubuntu"

# glibc file names
node_glibc_package_file_name: "libc6_{{ zcash.validator.glibc.package_version }}_{{ system_architecture }}.deb"
node_glibc_loader_file_name: ld-linux-x86-64.so.2
