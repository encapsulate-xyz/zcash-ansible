---
node_ufw_rules:
  - port: "{{ zcash.validator.ports.p2p_port }}"
    proto: tcp
    rule: allow
    from: any
    comment: p2p_port
    # v18 turns the legacy Zcash network off by default, so this port is unused: removes the old rule from hosts
    delete: true

  # Crosslink's own peer network (v18+): PoW sync, BFT and transaction relay
  - port: "{{ zcash.validator.ports.network_local_port }}"
    proto: udp
    rule: allow
    from: any
    comment: network_local_port

  - port: "{{ zcash.validator.ports.metrics_port }}"
    proto: tcp
    rule: allow
    from: "{{ monitor_server_dns }}"
    comment: metrics_port
