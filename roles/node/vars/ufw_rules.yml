---
node_ufw_rules:
  - port: "{{ zcash.validator.ports.p2p_port }}"
    proto: tcp
    rule: allow
    from: any
    comment: p2p_port

  - port: "{{ zcash.validator.ports.metrics_port }}"
    proto: tcp
    rule: allow
    from: "{{ monitor_server_dns }}"
    comment: metrics_port

# Only on hosts with rpc_tailnet (i1, the finalizer): their RPC binds every interface
# (config.toml.j2), and this lets it in on the Tailscale interface only. Every other interface stays
# denied by the default incoming policy; the Tailscale grants in server-setup-playbook decide which
# tailnet devices may connect.
node_rpc_tailnet_ufw_rules:
  - port: "{{ zcash.validator.ports.rpc_port }}"
    proto: tcp
    rule: allow
    from: any
    interface: tailscale0
    comment: rpc_port on tailscale0
