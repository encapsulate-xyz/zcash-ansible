---
- name: Include the specific network's vars file
  ansible.builtin.include_vars:
    file: vars/ufw_rules.yml

- name: Apply UFW rules for each node type
  ansible.builtin.include_tasks: tasks/apply_ufw_rules.yml
  loop: "{{ node_ufw_rules }}"

- name: Include user creation task
  ansible.builtin.include_tasks: tasks/create_user_and_directories.yml
  vars:
    home: "{{ node_home_dir }}"
    directories: "{{ node_directories }}"
    log_file_path: "{{ node_log_file_path }}"

- name: Copy node configuration file
  ansible.builtin.template:
    src: "{{ env }}/config.toml.j2"
    dest: "{{ node_config_file_path }}"
    owner: "{{ service_identifier }}"
    group: "{{ service_identifier }}"
    mode: "0644"
  notify:
    - Restart service

- name: Fetch the service binary
  ansible.builtin.get_url:
    url: "{{ zcash.validator.source_url }}/{{ zcash.validator.version }}/{{ node_service_default_binary_name }}"
    dest: "{{ node_bin_dir }}/{{ service_identifier }}"
    owner: root
    group: root
    force: true
    mode: "0755"
  notify:
    - Restart service

- name: Get the host glibc version
  ansible.builtin.command:
    cmd: getconf GNU_LIBC_VERSION
  register: node_host_glibc
  changed_when: false

- name: Set whether the host glibc is older than the binary needs
  ansible.builtin.set_fact:
    node_glibc_compat: "{{ node_host_glibc.stdout.split()[-1] is version(zcash.validator.glibc.version, '<') }}"

- name: Include extract glibc task
  when: node_glibc_compat | default(true) | bool
  ansible.builtin.include_tasks: extract_glibc.yml
  vars:
    extracted_dir: "{{ tmp_dir }}/{{ service_identifier }}/usr/lib/{{ ansible_architecture }}-linux-gnu"

- name: Fetch secrets environment from HCP Vault
  when: fetch_vault_secrets | default(false) | bool
  block:
    - name: Fetch private key from HCP Vault
      ansible.builtin.include_tasks: tasks/get_and_save_vault_secret.yml
      vars:
        vault_secret_source_path: "{{ project }}/{{ org }}/{{ type }}/{{ node_secret_seed_file_name }}"
        secret_destination_path: "{{ node_secret_seed_file_path }}"
        secret_type: base64

- name: Copy systemd service file
  ansible.builtin.template:
    src: "{{ env }}/systemd.service.j2"
    dest: /etc/systemd/system/{{ service_identifier }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload service
    - Restart service

# Lets tailnet peers (the Holdfast explorer's indexer) reach the node RPC while it stays bound to
# 127.0.0.1. Who may connect is decided by the Tailscale grants in server-setup-playbook.
- name: Forward the node RPC to the tailnet
  when: tailscale_serve_rpc | default(false) | bool
  block:
    - name: Read the Tailscale serve config
      ansible.builtin.command: tailscale serve status --json
      register: tailscale_serve_status
      changed_when: false

    - name: Forward tailnet port {{ zcash.validator.ports.rpc_port }} to the RPC on 127.0.0.1
      ansible.builtin.command: >-
        tailscale serve --bg --tcp {{ zcash.validator.ports.rpc_port }}
        tcp://127.0.0.1:{{ zcash.validator.ports.rpc_port }}
      when: >-
        ((tailscale_serve_status.stdout | default('{}', true) | from_json).TCP | default({}))[zcash.validator.ports.rpc_port | string]
        is not defined
