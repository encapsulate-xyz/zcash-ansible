---
# Converts the finalizer's commission into bonds, 1 cTAZ at a time (files/autoconvert.sh), on hosts
# with autoconvert: true. It runs as the node's user, which owns secret.seed, so nobody needs sudo.
- name: Set up the auto-convert service
  when: autoconvert | default(false) | bool
  block:
    - name: Install the tools the auto-convert script uses
      ansible.builtin.apt:
        name:
          - jq
          - curl
        state: present

    - name: Copy the auto-convert script
      ansible.builtin.copy:
        src: autoconvert.sh
        dest: "{{ autoconvert_script_path }}"
        owner: root
        group: root
        mode: "0755"
      notify:
        - Restart autoconvert

    - name: Create the auto-convert log file
      ansible.builtin.file:
        path: "{{ autoconvert_log_file_path }}"
        state: touch
        owner: "{{ service_identifier }}"
        group: "{{ service_identifier }}"
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Copy the auto-convert systemd service file
      ansible.builtin.template:
        src: "{{ env }}/autoconvert.service.j2"
        dest: /etc/systemd/system/autoconvert.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload service
        - Restart autoconvert

    - name: Start the auto-convert service and enable it at boot
      ansible.builtin.systemd:
        name: autoconvert
        state: started
        enabled: true
        daemon_reload: true

- name: Remove the auto-convert service from hosts where it's off
  when: not (autoconvert | default(false) | bool)
  block:
    - name: Check for the auto-convert service file
      ansible.builtin.stat:
        path: /etc/systemd/system/autoconvert.service
      register: autoconvert_unit

    - name: Stop and disable the auto-convert service
      when: autoconvert_unit.stat.exists
      ansible.builtin.systemd:
        name: autoconvert
        state: stopped
        enabled: false

    - name: Delete the auto-convert service file
      when: autoconvert_unit.stat.exists
      ansible.builtin.file:
        path: /etc/systemd/system/autoconvert.service
        state: absent
      notify:
        - Reload service
