---
- name: Create lib directory
  ansible.builtin.file:
    path: "{{ node_lib_dir }}"
    state: directory
    owner: "{{ service_identifier }}"
    group: "{{ service_identifier }}"
    mode: "0755"

- name: Create a tmp directory
  ansible.builtin.file:
    path: "{{ tmp_dir }}/{{ service_identifier }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download glibc package
  block:
    - name: Download glibc package from the Ubuntu mirror
      ansible.builtin.get_url:
        url: "{{ zcash.validator.glibc.source_url }}/{{ node_glibc_package_file_name }}"
        dest: "{{ tmp_dir }}/{{ service_identifier }}/{{ node_glibc_package_file_name }}"
        checksum: "{{ zcash.validator.glibc.checksum }}"
        timeout: 60
        owner: root
        group: root
        mode: "0644"
  rescue:
    # the mirror deletes superseded builds; Launchpad keeps them but is slow and sometimes returns 503
    - name: Download glibc package from Launchpad
      ansible.builtin.get_url:
        url: "{{ zcash.validator.glibc.fallback_source_url }}/{{ node_glibc_package_file_name }}"
        dest: "{{ tmp_dir }}/{{ service_identifier }}/{{ node_glibc_package_file_name }}"
        checksum: "{{ zcash.validator.glibc.checksum }}"
        timeout: 120
        owner: root
        group: root
        mode: "0644"
      register: node_glibc_fallback_download
      retries: 3
      delay: 10
      until: node_glibc_fallback_download is succeeded

- name: Extract glibc package
  ansible.builtin.command:
    cmd: >-
      dpkg-deb -x
      "{{ tmp_dir }}/{{ service_identifier }}/{{ node_glibc_package_file_name }}"
      {{ tmp_dir }}/{{ service_identifier }}
    creates: "{{ extracted_dir }}/{{ node_glibc_loader_file_name }}"

- name: Find the extracted lib files
  ansible.builtin.find:
    paths: "{{ extracted_dir }}"
    recurse: true
    file_type: any
  register: node_glibc_files

- name: Create lib subdirectories
  ansible.builtin.file:
    path: "{{ node_lib_dir }}/{{ item.path | relpath(extracted_dir) }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ node_glibc_files.files | selectattr('isdir') | list }}"
  loop_control:
    label: "{{ item.path | relpath(extracted_dir) }}"

# one file at a time: a single-file copy writes a temp file and renames it over the old one, so the running node keeps
# its old loader until the restart. A directory copy writes in place and fails with "Text file busy" on the loader.
- name: Copy lib files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ node_lib_dir }}/{{ item.path | relpath(extracted_dir) }}"
    remote_src: true
    owner: root
    group: root
    force: true
    mode: "0755"
  loop: "{{ node_glibc_files.files | rejectattr('isdir') | list }}"
  loop_control:
    label: "{{ item.path | relpath(extracted_dir) }}"
  notify:
    - Restart service

- name: Clean up the temporary directory
  ansible.builtin.file:
    path: "{{ tmp_dir }}/{{ service_identifier }}"
    state: absent
